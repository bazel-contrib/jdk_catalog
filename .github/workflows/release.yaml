# Follows rules_java's bazel-contrib release workflow. Publishing is manual.
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag, e.g. v0.0.1
        required: true
        type: string

permissions: {}

jobs:
  release:
    permissions:
      id-token: write
      attestations: write
      contents: write
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@1d798ff015ed0696433e01e2c3ccbb2abefadad7 # v7.7.0
    with:
      tag_name: ${{ inputs.tag_name }}
      prerelease: false
      draft: true
      generate_release_notes: true
      release_files: dist/jdk_catalog-*.tar.gz
      bazel_test_command: cd examples/consuming && bazelisk test --config=java27 //:toolchain_test
