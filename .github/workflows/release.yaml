# Build a draft GitHub release from a pushed v* tag (or a manual dispatch)
# using bazel-contrib's reusable release workflow. Review the draft, then
# publish it; publishing triggers the Publish to BCR workflow.
name: Prepare release

on:
  push:
    tags:
    - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag, e.g. v0.1.0
        required: true
        type: string

permissions: {}

jobs:
  release:
    permissions:
      id-token: write
      attestations: write
      contents: write
    # Reference by tag, not a pinned commit SHA: the release build's SLSA
    # provenance records this ref, and BCR's attestation verification rejects a
    # bare SHA ("unexpected ref type"). rules_java/rules_go tag-pin it for the
    # same reason. Renovate is told to keep this unpinned in renovate.json.
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.7.0
    with:
      tag_name: ${{ inputs.tag_name || github.ref_name }}
      prerelease: false
      draft: true
      generate_release_notes: true
      release_files: dist/jdk_catalog-*.tar.gz
      bazel_test_command: cd examples/consuming && bazelisk test --config=java27 //:toolchain_test
