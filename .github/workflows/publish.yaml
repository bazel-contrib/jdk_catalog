# Submit a published release to the Bazel Central Registry. Runs automatically
# when a GitHub release is published (see the Prepare release workflow), and can
# be dispatched manually against an existing tag to retry. Follows the
# bazel-contrib/rules_jvm_external release-triggered publication pattern.
name: Publish to BCR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Published release tag, e.g. v0.1.0
        required: true
        type: string

permissions: {}

jobs:
  publish:
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Reference by tag, not a pinned commit SHA: publish-to-bcr signs the
    # source.json and MODULE.bazel attestations with this workflow as the
    # builder, and BCR's verifier rejects a bare SHA builder ref ("unexpected
    # ref type"). Same reason release.yaml tag-pins release_ruleset. Renovate
    # is told to keep this unpinned in renovate.json.
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.7.0
    with:
      tag_name: ${{ github.event.release.tag_name || inputs.tag_name }}
      registry_fork: bazel-contrib/bazel-central-registry
      draft: true
      attest: true
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
