name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolchains:
    name: ${{ matrix.os }} / Bazel ${{ matrix.bazel }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, macos-26-intel, windows-2025]
        bazel: [9.3.0]
    runs-on: ${{ matrix.os }}
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8 # 0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}-${{ matrix.bazel }}
      - name: Extract API documentation
        run: bazelisk build //docs:extensions //docs:repositories
      - name: Check generated API reference
        run: python tools/check_api_docs.py
      - name: Verify Java 25 compiler and runtime
        working-directory: examples/consuming
        run: bazelisk test --config=java25 --test_arg=25 --test_output=errors //:toolchain_test
      - name: Verify Java 27 compiler and runtime
        working-directory: examples/consuming
        run: bazelisk test --config=java27 --test_output=errors //:toolchain_test
      - name: Verify numeric runtime selector
        working-directory: examples/consuming
        run: bazelisk test --config=java27 --java_runtime_version=27 --test_output=errors //:toolchain_test
      - name: Run the example
        working-directory: examples/consuming
        run: bazelisk run --config=java27 //:hello
